[package]
name = "ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "PDF-Outliner"
path = "src/main.rs"

[dependencies]
pdf_engine = { path = "../pdf_engine" }
bookmark = { path = "../bookmark" }
import_export = { path = "../import_export" }
pdf_outline_writer = { path = "../pdf_outline_writer" }
pdf_ocr = { path = "../pdf_ocr" }
pdfium-render = { version = "0.9", features = ["thread_safe"] }
eframe = { version = "0.29", features = ["wgpu", "persistence"] }
egui = "0.29"
arboard = "3"
uuid.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rfd = "0.15"
env_logger = "0.11"
open = "5"
unicode-normalization = "0.1"
# 열린 파일이 든 폴더 감시 — 라이브 업데이트(내용이 바뀌면 다시 열기, file_watch.rs)는 모든
# 플랫폼에서 쓰고, 같은 폴더 안 이름 변경 추적(inode 대조)만 macOS 전용이다(app.rs).
# 예전엔 이름 변경 추적 전용이라 macOS 섹션에 있었는데, 라이브 업데이트를 넣으며 모든 플랫폼으로
# 옮김(v0.2.1 Windows CI 빌드 실패로 발견, 2026-09-14).
notify = "6"

[dev-dependencies]
tempfile = "=3.14.0"
# 아이콘 글리프가 폰트에 실제로 들어 있는지 확인하는 시험용(icons.rs). egui가 쓰는 것과 같은
# 파서라 버전을 맞춰 하나로 유니파이된다.
ttf-parser = "0.25"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# winit: Finder 더블클릭/"다음으로 열기"로 PDF를 열 때 파일 경로를 받기 위함
# (macos_open_file.rs) — winit 자체는 이 macOS Apple Event(application:openURLs:)를
# 지원하지 않아 bjorkii/winit 포크(korean-ime-discard-marked-text-0.30.13 브랜치, 루트
# Cargo.toml의 [patch.crates-io] 참고)에 직접 핸들러를 추가했다. eframe이 이미 이
# 패치된 winit을 쓰므로 버전만 맞추면 같은 인스턴스로 유니파이된다.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# 파일·폴더 선택 창을 직접 띄우기 위함(file_dialog.rs) — rfd의 macOS 백엔드는 창 제목을
# 바꾸지 못하고 안내 줄만 붙인다. Windows·Linux는 그대로 rfd를 쓴다. 버전은 rfd 0.15가 쓰는
# 것과 맞춰 같은 인스턴스로 유니파이된다.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
] }
